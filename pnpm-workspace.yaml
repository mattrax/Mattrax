  - "@solidjs/compiler-wasm32-wasi@2.0.0"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0"
  - "@solidjs/compiler@2.0.0"
  - "@solidjs/meta@2.0.0"
  - "@solidjs/router@2.0.0"
  - "@solidjs/signals@2.0.0"
  - "@solidjs/vite-plugin@3.0.1"
  - "@solidjs/web@2.0.0"
  - "@voidzero-dev/vite-plus-core@8.3.8000"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.7.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.7.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.7.0"
