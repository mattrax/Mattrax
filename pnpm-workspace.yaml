packages:
  - apps/*
  - packages/*

catalog:
  "@axe-core/playwright": ^4.14.0
  "@cloudflare/vite-plugin": 2.0.0-beta.v.12
  "@effect/platform-node": ^4.1.2
  "@effect/sql-mysql2": ^4.1.2
  "@lhci/cli": ^0.16.1
  "@playwright/test": ^1.65.0
  "@rolldown/perf-kit": ^0.1.0
  "@rspress/core": ^2.1.2
  "@rspress/plugin-llms": ^2.1.2
  "@simplewebauthn/browser": ^14.0.0
  "@simplewebauthn/server": ^14.0.1
  "@tanstack/solid-query": ^5.107.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@xmldom/xmldom": ^0.9.12
  "@yielded/auth": 0.1.0-beta.47
  "@yielded/auth-persistence-drizzle": 0.1.0-beta.47
  "@yielded/auth-platform-workerd": 0.1.0-beta.47
  "@yielded/auth-simplewebauthn": 0.1.0-beta.47
  asn1js: ^4.0.0
  cf: 1.0.0-beta.28
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  effect: ^4.1.2
  fast-plist: ^0.1.3
  mysql2: ^3.24.6
  oxc-minify: ^0.157.0
  pkijs: ^4.0.1
  posthog-js: ^1.448.0
  posthog-node: ^5.73.0
  react: ^19.3.1
  reflect-metadata: ^0.2.2
  typescript: ~7.0.2
  uqr: ^0.1.3
  vite: npm:@voidzero-dev/vite-plus-core@^1.5.0
  vite-plus: ^1.5.0
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.24

catalogMode: prefer

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

overrides:
  vite: "catalog:"
patchedDependencies:
  "@yielded/auth-persistence-drizzle@0.1.0-beta.47": patches/@yielded__auth-persistence-drizzle@0.1.0-beta.47.patch
  "@yielded/auth-persistence@0.1.0-beta.47": patches/@yielded__auth-persistence@0.1.0-beta.47.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest

  allowedVersions:
    "@solidjs/web": "2.0.0-rc.21"
    # @kobalte/core 2.0.0-alpha.4 pins the Solid 2 RC it was built against
    # (rc.16); the app runs the latest rc, which is API-compatible.
    solid-js: "2.0.0-rc.21"
    vite: "*"
    vitest: "*"
