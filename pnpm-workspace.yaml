  yaml: ^2.9.1
  "@mbakereth/ldapjs-dn": ^1.1.2
catalogMode: prefer

overrides:
  vite: "catalog:"
patchedDependencies:
  "@tanstack/solid-query@6.0.0-rc.5": patches/@tanstack__solid-query@6.0.0-rc.5.patch
  "@yielded/auth-persistence-drizzle@0.1.0-beta.47": patches/@yielded__auth-persistence-drizzle@0.1.0-beta.47.patch
  "@yielded/auth-persistence@0.1.0-beta.47": patches/@yielded__auth-persistence@0.1.0-beta.47.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest

  allowedVersions:
    "@solidjs/web": "2.0.0"
    # @kobalte/core 2.0.0-alpha.4 pins the Solid 2 RC it was built against
    # (rc.16); the app runs the stable release, which is API-compatible.
    solid-js: "2.0.0"
    vite: "*"
    vitest: "*"

# The v13 format is JSON-as-YAML with a trailing comma after every entry, so
# peer-dependency changes touch one line instead of conflicting across branches.
lockfile:
  format: v13
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  workerd: true
# These releases were published inside pnpm 12's minimum release age window
# (the Solid 2.0.0 line and the vite-plus 1.7.0 toolchain both shipped very
# recently). Explicitly allow-listing them keeps the policy on for everything
# else instead of disabling it.
minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.6"
  - "@ui-sdk/solid@0.1.0-beta.6"
  - "@cloudflare/build-output-utils@1.0.0-rc.1"
  - "@cloudflare/config@1.0.0-rc.1"
  - "@cloudflare/runtime-types@0.1.30"
  - "@solidjs/compiler-darwin-arm64@2.0.0"
