packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^24.12.2
  "@types/pkijs": ^3.0.1
  '@xmldom/xmldom': ^0.9.10
  asn1js: ^3.0.10
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  effect: 4.0.0-beta.52
  fast-plist: ^0.1.3
  pkijs: ^3.4.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.20

catalogMode: prefer

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

  allowedVersions:
    vite: "*"
    vitest: "*"
