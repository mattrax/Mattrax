# Self-hosted Mattrax.
#
#   ORIGIN=https://mdm.example.com AUTH_SECRET=$(openssl rand -base64 32) \
#     docker compose -f apps/docker/docker-compose.yml pull
#   ORIGIN=https://mdm.example.com AUTH_SECRET=$(openssl rand -base64 32) \
#     docker compose -f apps/docker/docker-compose.yml up -d
#
# Pulls the published image from GHCR by default. The default, `latest`,
# follows the newest stable release; pin a published tag with
# MATTRAX_VERSION=<version> to keep a deployment fixed. To build from a
# checkout instead, add the build override:
#
#   docker compose -f apps/docker/docker-compose.yml \
#     -f apps/docker/docker-compose.build.yml up -d --build
#
# ORIGIN must be the public HTTPS URL devices and browsers use. TLS is
# terminated by a reverse proxy in front of this container.

# The project name is pinned so moving this file does not rename the existing
# `mattrax-data` and `mattrax-mysql` volumes on upgrade.
name: mattrax

services:
  app:
    image: ghcr.io/mattrax/mattrax:${MATTRAX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ORIGIN: ${ORIGIN:?set ORIGIN to the public https URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to a random secret}
      DATABASE_URL: mysql://mattrax:${MYSQL_PASSWORD:-mattrax}@mysql:3306/mattrax
      # Required when the proxy terminates device mTLS. See the self-hosting
      # docs before enabling: the proxy must strip caller-supplied values.
      TRUST_DEVICE_IDENTITY_HEADERS: ${TRUST_DEVICE_IDENTITY_HEADERS:-}
      # Optional integrations, all disabled when unset.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      # Optional support form or calendar URL shown in the app menu.
      SUPPORT_URL: ${SUPPORT_URL:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      CLOUD_APPLE_VENDOR_CERT: ${CLOUD_APPLE_VENDOR_CERT:-}
      CLOUD_APPLE_VENDOR_KEY: ${CLOUD_APPLE_VENDOR_KEY:-}
      APPLE_PROFILE_SIGNING_CERT: ${APPLE_PROFILE_SIGNING_CERT:-}
      APPLE_PROFILE_SIGNING_KEY: ${APPLE_PROFILE_SIGNING_KEY:-}
      APPLE_PROFILE_SIGNING_CHAIN: ${APPLE_PROFILE_SIGNING_CHAIN:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ANDROID_MANAGEMENT_SERVICE_ACCOUNT_JSON: ${ANDROID_MANAGEMENT_SERVICE_ACCOUNT_JSON:-}
      ANDROID_MANAGEMENT_PROJECT_ID: ${ANDROID_MANAGEMENT_PROJECT_ID:-}
      ANDROID_MANAGEMENT_PUBSUB_TOPIC: ${ANDROID_MANAGEMENT_PUBSUB_TOPIC:-}
      ANDROID_MANAGEMENT_PUBSUB_SUBSCRIPTION: ${ANDROID_MANAGEMENT_PUBSUB_SUBSCRIPTION:-}
      ANDROID_MANAGEMENT_PUBSUB_AUDIENCE: ${ANDROID_MANAGEMENT_PUBSUB_AUDIENCE:-}
      # Outbound email. Without a transport the container declares email
      # disabled (readiness reports mailer: skipped) and nothing is logged.
      #   smtp -> MAIL_TRANSPORT=smtp, MAIL_FROM, MAIL_SMTP_HOST, ...
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_HELO: ${MAIL_SMTP_HELO:-}
      # Deployment licence billing from the Mattrax cloud. The billing URL is
      # derived from the built-in services origin.
      MATTRAX_LICENSE_KEY: ${MATTRAX_LICENSE_KEY:-}
      MAINTENANCE_ONBOARDING_EMAILS: ${MAINTENANCE_ONBOARDING_EMAILS:-true}
      MAINTENANCE_ONBOARDING_FOLLOW_UP_DAYS: ${MAINTENANCE_ONBOARDING_FOLLOW_UP_DAYS:-7}
      MAINTENANCE_ONBOARDING_WINDOW_DAYS: ${MAINTENANCE_ONBOARDING_WINDOW_DAYS:-7}
      MAINTENANCE_ONBOARDING_COOLDOWN_DAYS: ${MAINTENANCE_ONBOARDING_COOLDOWN_DAYS:-7}
      MATTRAX_ONBOARDING_SINCE: ${MATTRAX_ONBOARDING_SINCE:-}
      MATTRAX_ONBOARDING_REPLY_TO: ${MATTRAX_ONBOARDING_REPLY_TO:-}
      MATTRAX_ONBOARDING_SUPPORT_EMAIL: ${MATTRAX_ONBOARDING_SUPPORT_EMAIL:-}
    ports:
      - "8080:8080"
    volumes:
      - mattrax-data:/data

  mysql:
    # MySQL 26.10 refuses to start on an 8.4 data directory; dump and restore
    # when upgrading an existing `mattrax-mysql` volume. See self-hosting.md.
    image: mysql:26.10
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: mattrax
      MYSQL_USER: mattrax
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mattrax}
    volumes:
      - mattrax-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-umattrax",
          "-p${MYSQL_PASSWORD:-mattrax}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mattrax-data:
  mattrax-mysql:
