# Source build for apps/docker/docker-compose.yml.
#
# The base file pulls the published image. Layer this override to build the same
# Dockerfile from the checkout instead, which is what contributors and air-gapped
# installs need:
#
#   docker compose -f apps/docker/docker-compose.yml \
#     -f apps/docker/docker-compose.build.yml up -d --build
#
# The local tag is fixed so an accidental source build cannot overwrite a
# published version tag in the local image store. MATTRAX_VERSION is unused here.
services:
  app:
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
    image: mattrax-selfhost:local
