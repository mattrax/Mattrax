# Labels applied to pull requests based on the files they change.
#
# Area labels only fire on the files that belong to that area, so a
# cross-cutting PR picks up several labels and a docs-only PR picks up just
# `documentation`. Add new labels here only after creating them in the
# repository, otherwise the labeler run logs a warning for that label.
#
# Keep globs in sync with the layout in `apps/` and `packages/`.

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/*.md"

design:
  - changed-files:
      - any-glob-to-any-file:
          - design/**
          - "**/*.pen"
          - apps/web/src/styles/**
          - apps/web/src/app.css
          - apps/web/src/components/ui/**
          - apps/web/public/assets/brand/**

appledm:
  - changed-files:
      - any-glob-to-any-file:
          - packages/dm-apple/**
          - packages/mdm-apple/**
          - packages/mdm-core/**
          - packages/apns/**
          - packages/scep/**
          - packages/plist/**
          - packages/apple-business-manager/**
          - apps/services/**
          - packages/enterprise-backend/src/Device/appleInventory.ts
          - packages/enterprise-backend/src/Scep/**

windm:
  - changed-files:
      - any-glob-to-any-file:
          - packages/dm-windows/**
          - packages/mdm-windows/**
          - packages/mdm-core/**
          - packages/soap/**
          - packages/enterprise-backend/src/Autopilot/**
          - packages/enterprise-backend/src/Device/windowsApplications.ts
          - data/catalog/windows.json
          - apps/web/public/catalog/windows/**

androiddm:
  - changed-files:
      - any-glob-to-any-file:
          - packages/dm-android/**
          - packages/enterprise-backend/src/Device/android.ts

tech-debt:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - apps/*/scripts/**
          - packages/*/scripts/**
          - tools/**
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - tsconfig.json
          - oxlint.config.ts
          - vite.config.ts
          - playwright.config.ts
          - packages/config/**
