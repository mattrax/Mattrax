version: 2

# One weekly run per ecosystem. Runtime and tooling versions live in the pnpm
# catalog (`pnpm-workspace.yaml`), which Dependabot updates through the root
# npm entry; workspace `package.json` files only ever say `catalog:`.
#
# Minor and patch updates arrive as one PR per ecosystem so the lockfile and
# deployment images stay reviewable together. Majors get their own PR because
# they need the migration notes read, not a rubber stamp.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # The Solid 2 RC and the Kobalte alpha it targets move in lockstep with
      # the UI; a bot bumping either alone breaks the component layer.
      - dependency-name: solid-js
        update-types: [version-update:semver-major]
      - dependency-name: "@solidjs/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@kobalte/*"
        update-types: [version-update:semver-major]
      # 1.65.1 starts failing WebAuthn registration in the CDP virtual
      # authenticator; stay on 1.65.0 until a fixed patch is published.
      - dependency-name: "@playwright/test"
        versions: ["1.65.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
