version: 2

# One weekly PR across every ecosystem keeps the workspace lockfile and the
# deployment images reviewable as a unit. This mirrors the shape used by
# specta-rs/specta: a single multi-ecosystem group with catch-all patterns.
multi-ecosystem-groups:
  mattrax-deps:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: mattrax-deps
    patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: mattrax-deps
    patterns: ["*"]
    ignore:
      # The Solid 2 RC and the Kobalte alpha it targets move in lockstep with
      # the UI; a bot bumping either alone breaks the component layer.
      - dependency-name: solid-js
        update-types: [version-update:semver-major]
      - dependency-name: "@solidjs/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@kobalte/*"
        update-types: [version-update:semver-major]
      # 1.65.1 starts failing WebAuthn registration in the CDP virtual
      # authenticator; stay on 1.65.0 until a fixed patch is published.
      - dependency-name: "@playwright/test"
        versions: ["1.65.1"]

  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: mattrax-deps
    patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    multi-ecosystem-group: mattrax-deps
    patterns: ["*"]
