name: CI

# Only `main` and pull requests run CI. Feature branches used to push as well,
# which meant every push to an `oscar/o/**` branch with an open PR started two
# complete runs of the same commit (one `push`, one `pull_request`); measured
# runs were 25 minutes each because of the browser suite. The PR event already
# checks the branch head, so the push trigger was pure duplicate work.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only checkout. Every job only reads the repository; uploaded artifacts
# use the runner's scoped token, not a repository permission.
permissions:
  contents: read

jobs:
  # The browser and Lighthouse suites are the two expensive jobs (the browser
  # suite was ~85% of a run's wall clock). They cannot be affected by a
  # Markdown, docs-site, workflow or licence-only change, so this job decides
  # whether they are worth starting. It always runs (a skipped workflow would
  # leave required checks pending); the suites themselves are skipped, which
  # GitHub reports as success.
  #
  # The filter is deliberately fail-safe: `**` matches everything and only
  # paths that cannot affect the suites are subtracted, so a path added to the
  # repository later runs the suites instead of silently skipping them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
      # Narrower than `suites`: only the paths that can change what Lighthouse
      # measures. See the filter below.
      perf: ${{ steps.suites.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # A filter that cannot run must not silently skip the suites; the step
        # below turns a missing answer into `true` (run them).
        continue-on-error: true
        with:
          # `some` (the default) treats `!pattern` as just another alternative,
          # which would match almost everything; `some-with-excludes` is the
          # "include `**`, then subtract these paths" semantics this filter
          # needs.
          predicate-quantifier: some-with-excludes
          filters: |
            suites:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
            # Lighthouse serves the self-host build of `apps/web`, so it is only
            # worth scheduling when something that build bundles can have moved.
            # Same fail-safe shape as `suites`: start from everything and subtract
            # the paths that cannot reach that build.
            perf:
              - '**'
              - '!**/*.md'
              # Not `docs/`: the web build derives public routes from it, so a
              # docs change can move the pages Lighthouse measures.
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
              - '!apps/mattraxd/**'
              - '!tests/**'
              - '!bench/**'
      - id: suites
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          MATCHED: ${{ steps.filter.outputs.suites }}
          PERF_MATCHED: ${{ steps.filter.outputs.perf }}
        run: |
          # Only a filter that actually ran may say "nothing to run". A failed,
          # cancelled or skipped filter falls back to running the suites, as
          # does an empty answer.
          if [ "$FILTER_OUTCOME" = "success" ] && [ -n "$MATCHED" ]; then
            echo "suites=$MATCHED" >> "$GITHUB_OUTPUT"
          else
            echo "suites=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$FILTER_OUTCOME" = "success" ] && [ -n "$PERF_MATCHED" ]; then
            echo "perf=$PERF_MATCHED" >> "$GITHUB_OUTPUT"
          else
            echo "perf=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Unit tests, typecheck and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Rspress `lastUpdated` reads per-file Git history. Blob-less history
          # is all it needs, so the commit graph is fetched without file
          # contents.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `pnpm typecheck` generates the two Workers' `cf` types, builds the root
      # project references once, then checks the dedicated test, tooling and
      # portable-entrypoint projects.
      - run: pnpm typecheck
      - run: pnpm doc:build
      # Production Workers must actually build. Typechecking alone did not
      # catch a layer-wiring bug that made every /mdm route return 500.
      - run: pnpm cloud build
      - run: pnpm web build
      # Fail when the schema changes without a committed migration snapshot.
      - run: pnpm cloud db:generate
      - run: test -z "$(git status --porcelain -- apps/cloud/migrations)"

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lighthouse needs no output from `check`: it installs, builds the
    # self-host bundle and serves it itself. Waiting for `check` serialised
    # ~3 minutes in front of a ~3 minute job for no benefit; a broken PR still
    # fails `check` and this job on its own.
    #
    # The budgets are a smoke test for the public pages, not a gate on every
    # commit. Measured over a week of `main` runs, `/designer` - a client
    # rendered canvas editor - scores 0.83-0.84 against the shared 0.85 budget
    # with 608-657 ms of total blocking time against 500 ms, so the job failed
    # about half of the pull requests that could not have moved it. It now runs
    # where its answer is actionable: on every push to `main`, and on pull
    # requests that touch something the self-host build bundles (`perf` above).
    # The budgets themselves live in `packages/config/lighthouserc.cjs`.
    #
    # `needs:` alone would skip this job when `changes` fails or times out, and
    # a skipped job reports success, so run unless the gate positively decided
    # the change cannot affect the suite.
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.perf == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write local dev environment
        run: |
          cat > apps/cloud/.dev.vars <<'VARS'
          ORIGIN=http://localhost:9050
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789abcdef
          STRIPE_WEBHOOK_SECRET=whsec_ci
          DEV_MAILBOX=true
          VARS
          cp apps/cloud/.dev.vars apps/web/.dev.vars
          cp apps/cloud/.dev.vars .dev.vars
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  # One runner per shard, each with its own MySQL service and dev server on the
  # same port. The suite runs with a single Playwright worker because its tests
  # share dev-mailbox state and rate-limit buckets through one server; sharding
  # keeps that isolation intact while the suite as a whole runs in parallel.
  #
  # `packages/config/scripts/e2e-shard.ts` assigns the spec files instead of
  # Playwright's `--shard`: a contiguous slice of the file list is only balanced
  # while every spec has the same number of tests, and with eight slices they
  # held 33, 38, 25, 27, 30, 44, 17 and 29 tests. The heaviest slice - not the
  # number of runners - was the suite's wall clock. Files are now assigned
  # largest-first to the emptiest shard, which splits them 31, 31, 31, 30, 30,
  # 30, 30 and 30, and the assignment is recomputed on every run so a growing
  # spec moves shard instead of inflating one.
  #
  # Each shard pays ~2 minutes of setup (service container, checkout, install,
  # browser, migrations, dev server), so the matrix stops at eight.
  e2e:
    # The denominator comes from the matrix itself, so adding or removing a
    # shard cannot leave a shard running a stale share of the suite.
    name: Browser tests (CDP, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # A failed or timed-out gate must not turn into a skipped (successful)
    # browser suite; see the `suites` step in the `changes` job.
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.suites == 'true')
    runs-on: ubuntu-latest
    # A retried failure costs two 60 second timeouts on its own and the budget
    # has to swallow one pathological spec, so keep well above the ~10 minute
    # expectation for a balanced shard.
    timeout-minutes: 45
    strategy:
      # Every shard's failure report is useful; do not cancel the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      mysql:
        # MySQL 8.0, the version the Worker's mysql2 client is exercised
        # against over plain TCP.
        #
        # `services.options` only accepts `docker create` flags, so a server
        # argument such as `--default-authentication-plugin` cannot go there
        # (docker rejects it as an unknown flag). GitHub does support
        # `services.mysql.command`, but the released actionlint (v1.7.12)
        # predates that key, so the application user's auth plugin is pinned
        # explicitly with SQL below instead.
        #
        # 8.0 defaults to caching_sha2_password. The Worker connects without TLS
        # and does not set `allowPublicKeyRetrieval`, so the suite's user must
        # use mysql_native_password. MySQL 8.4 removes the old server flag and
        # needs `--mysql-native-password=ON`; revisit this on an image bump.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mattraxe
          MYSQL_USER: mattrax
          MYSQL_PASSWORD: mattrax
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umattrax -pmattrax"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_CHANNEL: bundled
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: mattrax
      DATABASE_PASSWORD: mattrax
      DATABASE_NAME: mattraxe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is ~9 seconds per shard, and the cache takes the
      # CDN off the critical path for the other seven. The key is the installed
      # `@playwright/test` version (pinned in the lockfile) rather than the
      # lockfile hash, so an unrelated dependency bump does not re-download it.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # `pnpm exec` uses the version the lockfile installed; `npx` resolves it
      # through npm first.
      #
      # `--with-deps` stays: the runner image ships Chrome, but its `apt-get`
      # still installs nine of chromium's libraries (~10 seconds), so dropping
      # it would trade those seconds for a browser that cannot launch.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Write local dev environment
        run: |
          cat > apps/cloud/.dev.vars <<'VARS'
          ORIGIN=http://localhost:9050
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789abcdef
          STRIPE_WEBHOOK_SECRET=whsec_ci
          DEV_MAILBOX=true
          VARS
          cp apps/cloud/.dev.vars apps/web/.dev.vars
          cp apps/cloud/.dev.vars .dev.vars
      # See the note on the MySQL service: the container cannot be started with
      # the old `--default-authentication-plugin` flag, so pin the application
      # user's plugin before anything (migrations included) connects.
      - name: Pin the application user to mysql_native_password
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot \
            -e "ALTER USER 'mattrax'@'%' IDENTIFIED WITH mysql_native_password BY 'mattrax';"
      - run: pnpm cloud db:migrate
      # Start the dev server outside Playwright so its teardown cannot wait on a
      # Vite process that `setsid` reparented. Playwright then only runs tests.
      - name: Start the dev server
        run: |
          pnpm web dev > /tmp/web-dev.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:9050/api/health >/dev/null &&
               curl -fsS http://localhost:9050/login >/dev/null; then
              # Give the client/SSR optimizers a moment to settle.
              sleep 10
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server did not start after ${attempt} attempts"
          tail -100 /tmp/web-dev.log
          exit 1
      - name: Browser tests
        env:
          E2E_BASE_URL: http://localhost:9050
        run: |
          # `E2E_SHARD` is still the shard's name; the script turns it into the
          # spec files that shard owns. It exits non-zero rather than printing
          # nothing, because Playwright with no argument runs the whole suite.
          specs=$(pnpm exec tsx packages/config/scripts/e2e-shard.ts "$E2E_SHARD")
          # One CLI filter per spec file: the split is the point, so the
          # variable is intentionally unquoted.
          # shellcheck disable=SC2086
          pnpm test:e2e $specs
      - name: Stop the dev server
        if: always()
        run: pkill -9 -f 'vite.js dev' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
