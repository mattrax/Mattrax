name: CI

# Only `main` and pull requests run CI. Feature branches used to push as well,
# which meant every push to an `oscar/o/**` branch with an open PR started two
# complete runs of the same commit (one `push`, one `pull_request`); measured
# runs were 25 minutes each because of the browser suite. The PR event already
# checks the branch head, so the push trigger was pure duplicate work.
on:
  push:
    branches: [main]
  pull_request:
  # A manual full-suite run for a branch, used as the escape hatch when the
  # changed-only policy is enabled for pull requests.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only checkout. Every job only reads the repository; uploaded artifacts
# use the runner's scoped token, not a repository permission.
permissions:
  contents: read

jobs:
  # The expensive jobs cannot be affected by a Markdown, docs-site, workflow or
  # licence-only change, so this job decides which of them are worth starting.
  # It always runs (a skipped workflow would leave required checks pending);
  # the jobs themselves are skipped, which GitHub reports as success.
  #
  # Every filter is deliberately fail-safe: `**` matches everything and only
  # paths that provably cannot affect that job are subtracted, so a path added
  # to the repository later runs the job instead of silently skipping it. The
  # step below turns a failed filter into `true` for the same reason.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      # `true` only when the changed-only policy is enabled and this pull
      # request has not opted back into the full suite with `e2e:full`.
      e2e_changed: ${{ steps.mode.outputs.changed }}
      docs: ${{ steps.outputs.outputs.docs }}
      schema: ${{ steps.outputs.outputs.schema }}
      cloud: ${{ steps.outputs.outputs.cloud }}
      web: ${{ steps.outputs.outputs.web }}
      perf: ${{ steps.outputs.outputs.perf }}
      suites: ${{ steps.outputs.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # A filter that cannot run must not silently skip a job; the step
        # below turns a missing answer into `true` (run it).
        continue-on-error: true
        with:
          # `some` (the default) treats `!pattern` as just another alternative,
          # which would match almost everything; `some-with-excludes` is the
          # "include `**`, then subtract these paths" semantics these filters
          # need.
          predicate-quantifier: some-with-excludes
          filters: |
            # The Rspress site, its theme, and the typedoc runner that reads the
            # management-backend contract. It cannot see the dashboard, the API
            # Worker or the other apps.
            docs:
              - '**'
              - '!tests/**'
              - '!bench/**'
              - '!apps/web/**'
              - '!apps/cloud/**'
              - '!apps/cli/**'
              - '!apps/docker/**'
              - '!apps/services/**'
              - '!apps/mdm-compliance/**'
              - '!apps/apns-relay/**'
              - '!apps/mattraxd/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
            # Paths that can change the migrated schema. This only schedules the
            # `migrations` job and its cache warm-up; the browser job falls
            # back to running the real migrations on a cache miss, so a path
            # missed here cannot hide drift.
            schema:
              - 'apps/cloud/migrations/**'
              - 'apps/cloud/src/db/**'
              - 'apps/cloud/drizzle.config.ts'
              - 'pnpm-lock.yaml'
            # The API Worker bundles apps/cloud and the packages it imports.
            cloud:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!tests/**'
              - '!bench/**'
              - '!apps/web/**'
              - '!apps/cli/**'
              - '!apps/docker/**'
              - '!apps/services/**'
              - '!apps/mdm-compliance/**'
              - '!apps/apns-relay/**'
              - '!apps/mattraxd/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
            # The dashboard bundle: apps/web plus every package it imports.
            web:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!tests/**'
              - '!bench/**'
              - '!apps/cloud/**'
              - '!apps/cli/**'
              - '!apps/docker/**'
              - '!apps/services/**'
              - '!apps/mdm-compliance/**'
              - '!apps/apns-relay/**'
              - '!apps/mattraxd/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
            # Lighthouse serves the self-host build of apps/web, so it is only
            # worth scheduling when something that build bundles can have moved.
            # Not `docs/`: the web build derives public routes from it, so a
            # docs change can move the pages Lighthouse measures.
            perf:
              - '**'
              - '!**/*.md'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
              - '!apps/mattraxd/**'
              - '!tests/**'
              - '!bench/**'
            # The browser suite drives the dashboard over CDP.
            suites:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.zed/**'
      # One output per filter. Only a filter that actually ran may say "nothing
      # to run"; a failed, cancelled or skipped filter falls back to running
      # the job, as does an empty answer.
      - id: outputs
        if: always()
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          DOCS: ${{ steps.filter.outputs.docs }}
          SCHEMA: ${{ steps.filter.outputs.schema }}
          CLOUD: ${{ steps.filter.outputs.cloud }}
          WEB: ${{ steps.filter.outputs.web }}
          PERF: ${{ steps.filter.outputs.perf }}
          SUITES: ${{ steps.filter.outputs.suites }}
        run: |
          if [ "$FILTER_OUTCOME" = "success" ]; then
            {
              echo "docs=${DOCS:-true}"
              echo "schema=${SCHEMA:-true}"
              echo "cloud=${CLOUD:-true}"
              echo "web=${WEB:-true}"
              echo "perf=${PERF:-true}"
              echo "suites=${SUITES:-true}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "docs=true"
              echo "schema=true"
              echo "cloud=true"
              echo "web=true"
              echo "perf=true"
              echo "suites=true"
            } >> "$GITHUB_OUTPUT"
          fi

      # Policy switch, off by default. Setting the repository variable
      # `E2E_CHANGED_ONLY=true` makes pull requests run only the spec files
      # changed by the PR; `e2e:full` on a pull request restores the full suite
      # there, and main is always full. The label is read by the next run (the
      # workflow deliberately does not listen for label events, which would
      # cancel a running full suite whenever an unrelated label is added).
      - id: mode
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          POLICY: ${{ vars.E2E_CHANGED_ONLY }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$POLICY" = "true" ] && [ "$FULL_LABEL" != "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The unit job used to run every check in series: lint 1m01s, vitest 4m26s,
  # typecheck 1m29s and the builds 42s, for 7-8 minutes in a single job. None of
  # those steps needs another's output, so the wall clock is now the slowest
  # parallel branch (typecheck ~1m29s) instead of their sum. Vitest no longer
  # needs shards: shared node projects cut the suite from 53s to 9s locally. Install is 4 seconds from the pnpm store cache, so each
  # job installs itself rather than waiting on an install job.
  #
  # Lint, vitest and typecheck always run. They are not gated on the changed
  # paths because they genuinely read them: `public-routes.test.ts` enumerates
  # the `docs/` tree, and lint covers the docs theme's components. Only the
  # builds and the two browser suites can be proven independent of a path.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `prelint` generates the two Workers' `cf` types first.
      - run: pnpm lint

  test:
    name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard's failure report is useful; do not cancel the rest.
      fail-fast: false
      # Shared node projects take the 5,427 tests in 478 files from 53s to 9s
      # locally; only files that pin a fake clock keep their own module graph.
      # One runner stays well under the two-minute budget.
      # Keep the shard in the name and command so the denominator still comes
      # from the matrix if the suite ever needs to fan out again.
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest keys its on-disk module cache by source content, so restoring
      # the cache cannot serve a stale transform when a file changes.
      - name: Restore the Vitest module cache
        id: vitest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: >-
            vitest-fs-v1-${{ runner.os }}-${{ hashFiles(
              'pnpm-lock.yaml', 'vite.config.ts', 'packages/config/vite.config.ts',
              'apps/web/vitest.config.ts') }}
      - name: Vitest
        # The denominator comes from the matrix, so changing the shard count
        # cannot leave a shard running a stale slice of the suite. Vitest
        # applies the shard across every configured project.
        run: pnpm test --shard="${{ matrix.shard }}/${{ strategy.job-total }}"
      - name: Save the Vitest module cache
        if: always() && steps.vitest-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vitest-cache
          key: >-
            vitest-fs-v1-${{ runner.os }}-${{ hashFiles(
              'pnpm-lock.yaml', 'vite.config.ts', 'packages/config/vite.config.ts',
              'apps/web/vitest.config.ts') }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: mattrax
      DATABASE_PASSWORD: mattrax
      DATABASE_NAME: mattraxe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm typecheck` generates the two Workers' `cf` types, builds the root
      # project references once, then checks the dedicated test, tooling and
      # portable-entrypoint projects.
      - run: pnpm typecheck

  build:
    name: Build and migrations
    needs: changes
    # The build steps are gated on their own paths; the migration steps only
    # run on main and schema-changing PRs. Folding migrations in here keeps the
    # job count at sixteen now that Lighthouse is a four-job matrix.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Rspress `lastUpdated` reads per-file Git history. Blob-less history
          # is all it needs, so the commit graph is fetched without file
          # contents.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Workers' builds read the generated `cf` types.
      - run: pnpm -r --if-present run cf:types
      - name: Build the documentation
        if: >-
          needs.changes.result != 'success' || needs.changes.outputs.docs == 'true'
        run: pnpm doc:build
      # Production Workers must actually build. Typechecking alone did not
      # catch a layer-wiring bug that made every /mdm route return 500.
      - name: Build the API Worker
        if: >-
          needs.changes.result != 'success' || needs.changes.outputs.cloud == 'true'
        run: pnpm cloud build
      - name: Build the dashboard
        if: >-
          needs.changes.result != 'success' || needs.changes.outputs.web == 'true'
        run: pnpm web build
      # Fail when the schema changes without a committed migration snapshot.
      - name: Generate migrations
        if: >-
          needs.changes.result != 'success' || needs.changes.outputs.cloud == 'true'
        run: pnpm cloud db:generate
      - name: Fail on an uncommitted migration snapshot
        if: >-
          needs.changes.result != 'success' || needs.changes.outputs.cloud == 'true'
        run: test -z "$(git status --porcelain -- apps/cloud/migrations)"

      - name: Start MySQL
        if: >-
          github.event_name == 'push' ||
          needs.changes.result != 'success' ||
          needs.changes.outputs.schema == 'true'
        run: |
          printf '[mysqld]\nmysql_native_password=ON\n' |
            sudo tee /etc/mysql/mysql.conf.d/zz-ci-native.cnf >/dev/null
          sudo systemctl start mysql.service
          ready=""
          for attempt in $(seq 1 30); do
            if mysqladmin -h127.0.0.1 -uroot -proot ping >/dev/null 2>&1; then
              ready="true"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::MySQL did not answer after ${attempt} attempts"
            exit 1
          fi
          mysql -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS mattraxe;
          CREATE USER IF NOT EXISTS 'mattrax'@'%' IDENTIFIED WITH mysql_native_password BY 'mattrax';
          ALTER USER 'mattrax'@'%' IDENTIFIED WITH mysql_native_password BY 'mattrax';
          GRANT ALL ON mattraxe.* TO 'mattrax'@'%';
          SQL
      - name: Apply every migration from scratch
        if: >-
          github.event_name == 'push' ||
          needs.changes.result != 'success' ||
          needs.changes.outputs.schema == 'true'
        run: pnpm cloud db:migrate
      # The shards load this instead of replaying 104 migrations. It is produced
      # by the real migration path above, keyed on the migration SQL, so it
      # cannot describe a schema the migrations do not produce.
      - name: Dump the migrated schema
        if: >-
          github.event_name == 'push' ||
          needs.changes.result != 'success' ||
          needs.changes.outputs.schema == 'true'
        run: |
          mkdir -p .ci
          mysqldump -h127.0.0.1 -umattrax -pmattrax \
            --no-data --skip-comments --no-tablespaces --triggers \
            --set-gtid-purged=OFF mattraxe > .ci/mysql-schema.sql
      # `save` rather than the combined action: the cache must be written even
      # when it already exists, and a concurrent shard may win the race with an
      # identical dump.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: >-
          github.event_name == 'push' ||
          needs.changes.result != 'success' ||
          needs.changes.outputs.schema == 'true'
        continue-on-error: true
        with:
          path: .ci/mysql-schema.sql
          key: mysql-schema-v1-${{ runner.os }}-${{ hashFiles('apps/cloud/migrations/*/migration.sql') }}

  lighthouse:
    name: Lighthouse budgets (${{ matrix.url }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One URL per runner: each job still takes three samples, so the median
      # and the budget confidence match the single-job `main` run, while the
      # wall clock is the slowest URL instead of all four in series.
      fail-fast: false
      matrix:
        url: ["/", "/login", "/register", "/designer"]
    # Lighthouse needs no output from another job: it installs, builds the
    # self-host bundle and serves it itself. The budgets are a smoke test for
    # the public pages, not a gate on every commit. Measured over a week of
    # `main` runs, `/designer` - a client rendered canvas editor - scores
    # 0.83-0.84 against the shared 0.85 budget with 608-657 ms of total
    # blocking time against 500 ms, so the job failed about half of the pull
    # requests that could not have moved it. It now runs where its answer is
    # actionable: on every push to `main`, and on pull requests that touch
    # something the self-host build bundles (`perf` above).
    #
    # `needs:` alone would skip this job when `changes` fails or times out,
    # and a skipped job reports success, so run unless the gate positively
    # decided the change cannot affect the suite.
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.perf == 'true')
    env:
      LHCI_URL: http://localhost:9050${{ matrix.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write local dev environment
        run: |
          cat > apps/cloud/.dev.vars <<'VARS'
          ORIGIN=http://localhost:9050
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789abcdef
          STRIPE_WEBHOOK_SECRET=whsec_ci
          DEV_MAILBOX=true
          VARS
          cp apps/cloud/.dev.vars apps/web/.dev.vars
          cp apps/cloud/.dev.vars .dev.vars
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: lighthouse-report-${{ strategy.job-index }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  # One runner and four Playwright workers. Tests own isolated browser contexts
  # and unique tenants; identity and passkey flows keep fresh accounts. Shared
  # setup uses API requests instead of repeating registration and an extra
  # dashboard document load for every test.
  #
  # The database is the runner image's MySQL 8.4 (production is 8.4; see
  # docs/operations/backups.md) started in place. The old Docker service spent
  # ~34s initialising a fresh data directory and another 29s applying 104
  # migrations per job. The shared schema cache keeps the 29s migration off
  # the path once main has published it; the build job above is the real path.
  #
  # The full 182-test suite runs in one job. Hydration-based navigation removes
  # ~600ms per document load, repeated registration is shared where account
  # state is not under test, and the production build comes from cache.
  #
  # Setup is ~25s: schema restore ~1s, browser cache ~2s, cached build ~5s
  # (MySQL and the schema load overlap it), plus the tests.
  e2e:
    name: Browser tests (CDP, ${{ needs.changes.outputs.e2e_changed == 'true' && 'changed files only' || 'full suite' }})
    needs: changes
    # A failed or timed-out gate must not turn into a skipped (successful)
    # browser suite; see the `outputs` step in the `changes` job.
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.suites == 'true')
    # The suite is CPU-bound. GitHub's arm64 image is a faster per-core host
    # than the x64 runner while still running the whole suite as one shard.
    runs-on: ubuntu-24.04-arm
    # Keep headroom for setup, artifacts and a retried failure.
    timeout-minutes: 30
    env:
      E2E_CHANNEL: bundled
      E2E_WORKERS: 6
      # Serve the production build rather than the dev server: a dashboard page
      # hydrates in ~70ms from built bundles against ~650ms in dev mode, and
      # every test loads several documents.
      E2E_SERVER: built
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: mattrax
      DATABASE_PASSWORD: mattrax
      DATABASE_NAME: mattraxe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `--only-changed` needs the base branch's history.
          fetch-depth: ${{ needs.changes.outputs.e2e_changed == 'true' && 0 || 1 }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore a content-addressed bundle instead of rebuilding the dashboard
      # on every run. The key hashes every input the bundle reads.
      - name: Restore the production build
        id: web-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/dist
            apps/web/.cloudflare/output
          key: >-
            web-e2e-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
              'pnpm-lock.yaml', 'apps/*/src/**', 'apps/*/scripts/**',
              'apps/*/public/**', 'apps/*/migrations/**', 'apps/*/package.json',
              'apps/*/*.config.ts', 'packages/**', 'docs/**',
              'vite.config.ts', 'package.json') }}
      - name: Fetch the base branch
        if: needs.changes.outputs.e2e_changed == 'true'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      # The migrated schema is this job's only copy. `hashFiles` reads the
      # 104 migration SQL files (not the 33MB of snapshots), so a migration
      # change misses the cache and the job replays the real migrations.
      - name: Restore the migrated schema
        id: schema
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/mysql-schema.sql
          key: mysql-schema-v1-${{ runner.os }}-${{ hashFiles('apps/cloud/migrations/*/migration.sql') }}
      # The browser download is ~7 seconds cold and cached after that. The key
      # is the installed `@playwright/test` version (pinned in the lockfile)
      # rather than the lockfile hash, so an unrelated dependency bump does not
      # re-download it.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # No `--with-deps`: measured on this runner image, Chromium launches and
      # runs the suite without the apt packages. Dropping it removes a ~10s
      # apt-get from the job; the browsers themselves are still the pinned
      # Playwright build, not the runner's Chrome.
      - run: pnpm exec playwright install chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Write local dev environment
        run: |
          cat > apps/cloud/.dev.vars <<'VARS'
          ORIGIN=http://localhost:9050
          AUTH_SECRET=ci-auth-secret-0123456789abcdef0123456789abcdef
          STRIPE_WEBHOOK_SECRET=whsec_ci
          DEV_MAILBOX=true
          VARS
          cp apps/cloud/.dev.vars apps/web/.dev.vars
          cp apps/cloud/.dev.vars .dev.vars
      # MySQL takes 8-19s to start on this image and the schema adds ~1s on a
      # cache hit (or a full migration on a miss). The dashboard build touches
      # neither, so both run in the background while the build does its 17-21s
      # of work; the ready marker carries the result across steps because each
      # step gets a new shell.
      - name: Start MySQL and load the schema in the background
        env:
          SCHEMA_CACHE_HIT: ${{ steps.schema.outputs.cache-hit }}
        run: |
          cat > /tmp/start-mysql.sh <<'SCRIPT'
          set -euo pipefail
          printf '[mysqld]\nmysql_native_password=ON\n' |
            sudo tee /etc/mysql/mysql.conf.d/zz-ci-native.cnf >/dev/null
          sudo systemctl start mysql.service
          ready=""
          for attempt in $(seq 1 30); do
            if mysqladmin -h127.0.0.1 -uroot -proot ping >/dev/null 2>&1; then
              ready="true"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "MySQL did not answer after ${attempt} attempts"
            exit 1
          fi
          mysql -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS mattraxe;
          CREATE USER IF NOT EXISTS 'mattrax'@'%' IDENTIFIED WITH mysql_native_password BY 'mattrax';
          ALTER USER 'mattrax'@'%' IDENTIFIED WITH mysql_native_password BY 'mattrax';
          GRANT ALL ON mattraxe.* TO 'mattrax'@'%';
          SQL
          if [ "${SCHEMA_CACHE_HIT:-false}" = "true" ]; then
            mysql -h127.0.0.1 -umattrax -pmattrax mattraxe < .ci/mysql-schema.sql
          else
            # The schema cache is cold: this is the real migration path. The
            # post-job cache save carries the dump to the next run.
            pnpm cloud db:migrate
            mkdir -p .ci
            mysqldump -h127.0.0.1 -umattrax -pmattrax \
              --no-data --skip-comments --no-tablespaces --triggers \
              --set-gtid-purged=OFF mattraxe > .ci/mysql-schema.sql
          fi
          SCRIPT
          rm -f /tmp/mysql-ready /tmp/mysql-failed
          nohup bash -c 'bash /tmp/start-mysql.sh && touch /tmp/mysql-ready || touch /tmp/mysql-failed' \
            > /tmp/mysql-setup.log 2>&1 &

      # Build and start the server outside Playwright so its teardown cannot
      # wait on a Vite process that `setsid` reparented. Playwright then only
      # runs tests. `e2e-server.ts` builds the production bundles, starts
      # `vite preview` on 9050, and returns once the server answers.
      #
      # A cache hit skips the build; a miss builds here and saves the bundle
      # for later runs. Polling every 0.5s instead of 2s trims another
      # second without changing the 180s ceiling.
      - name: Build and serve the production bundle
        env:
          E2E_SKIP_BUILD: ${{ steps.web-build.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          pnpm exec tsx apps/web/scripts/e2e-server.ts > /tmp/e2e-server.log 2>&1 &
          for attempt in $(seq 1 360); do
            if curl -fsS http://localhost:9050/api/health >/dev/null &&
               curl -fsS http://localhost:9050/login >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::e2e server did not start after ${attempt} attempts"
          tail -100 /tmp/e2e-server.log
          exit 1
      - name: Save the production build
        if: success() && steps.web-build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/dist
            apps/web/.cloudflare/output
          key: >-
            web-e2e-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
              'pnpm-lock.yaml', 'apps/*/src/**', 'apps/*/scripts/**',
              'apps/*/public/**', 'apps/*/migrations/**', 'apps/*/package.json',
              'apps/*/*.config.ts', 'packages/**', 'docs/**',
              'vite.config.ts', 'package.json') }}
      - name: Wait for MySQL and the schema
        run: |
          for attempt in $(seq 1 120); do
            if [ -f /tmp/mysql-ready ]; then exit 0; fi
            if [ -f /tmp/mysql-failed ]; then break; fi
            sleep 1
          done
          echo "::error::MySQL/schema setup did not finish after ${attempt} seconds"
          cat /tmp/mysql-setup.log
          exit 1
      - name: Browser tests
        env:
          E2E_BASE_URL: http://localhost:9050
          E2E_ONLY_CHANGED: ${{ needs.changes.outputs.e2e_changed }}
          # Keep the JSON report for timing history; the github reporter adds
          # inline failure annotations.
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-report.json
          E2E_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$E2E_ONLY_CHANGED" = "true" ]; then
            # Policy opt-in (repository variable `E2E_CHANGED_ONLY`): Playwright
            # selects only the spec files changed in this pull request. It is
            # not "affected" specs - a product change with no spec change
            # selects nothing, and `--pass-with-no-tests` makes that an explicit
            # success. Main is always full, and `e2e:full` restores the full
            # suite on a pull request.
            echo "changed-only policy: running spec files changed since origin/$E2E_BASE_REF"
            pnpm test:e2e --reporter=github,json --only-changed="origin/$E2E_BASE_REF" --pass-with-no-tests
            exit 0
          fi
          pnpm test:e2e --reporter=github,json
      - name: Stop the server
        if: always()
        run: |
          pkill -9 -f 'vite.js dev' || true
          pkill -9 -f 'vite.js preview' || true
          pkill -9 -f 'apps/web/scripts/e2e-server.ts' || true
      # Kept on success too so a full run always leaves a timing record.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-durations
          path: test-results/playwright-report.json
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
