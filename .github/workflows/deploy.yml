name: Deploy

# Continuous deployment for the hosted Workers, modelled on the setup in
# oscartbeaumont/shell.build:
#
# - every push to `main` applies production migrations and deploys both Workers;
# - every pull request gets a Worker Preview of the API and the dashboard,
#   posted as a sticky PR comment and deleted when the PR closes.
#
# Cloudflare Previews cannot reach another Worker's Preview through a service
# binding (it always resolves to that Worker's production deployment), so the
# dashboard Preview is deployed twice: first to learn its generated URL, then
# with `API_URL` pointing at the API Preview. See `apps/web/src/server/api.ts`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN      Workers Scripts:Edit, Workers R2 Storage:Edit,
#                             Workers Routes:Edit and Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID     the account that owns both Workers
#   DATABASE_URL              production MySQL connection used by migrations
#   AUTH_SECRET               optional dashboard Worker copy; when absent the
#                             secret already stored on the mattrax Worker is used
#   PREVIEW_DATABASE_URL      optional shared preview MySQL connection; when
#                             absent, PR Preview deployments are skipped
#
# Required repository variables:
#   PREVIEW_HYPERDRIVE_ID     Hyperdrive config pointing at the preview database
#   PREVIEW_STORAGE_BUCKET    R2 bucket for preview uploads and backups
#   PRODUCTION_ORIGIN         optional, defaults to https://e.mattrax.app
#
# Preview Workers read the production Worker secrets (AUTH_SECRET, Stripe,
# Apple/Android credentials, and DEV_MAILBOX_SECRET). Set DEV_MAILBOX_SECRET on
# both Workers once; previews opt into the guarded remote mailbox so sign-up
# codes are readable without sending real mail.
#
# Trust model — this is what the current configuration actually enforces:
#
# - Fork pull requests never receive secrets. The `deploy` job is skipped for
#   them, so neither the Cloudflare token nor any Worker secret is exposed.
# - Same-repository pull requests are trusted code. A branch pushed by anyone
#   with write access is deployed as a Worker Preview using the account-scoped
#   `CLOUDFLARE_API_TOKEN` (`Workers Scripts:Edit`), and previews run against
#   the shared preview database while reading the *production* Worker secrets
#   listed above. PR code therefore executes with those credentials and can
#   read them; write access to this repository is effectively access to the
#   production Cloudflare account and those secrets. There is no sandbox
#   beyond that boundary.
# - Dependabot pull requests are skipped.
#
# TODO(security): issue a dedicated Cloudflare token restricted to preview
# Workers (no production deploy/R2 access) and a separate preview secret set
# (AUTH_SECRET, Stripe, Apple/Android, DEV_MAILBOX_SECRET), then point the
# preview steps at them. Until that split exists, do not grant write access to
# anyone who is not trusted with production.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A newer commit cancels the in-flight run for the same PR or branch, so only
# the most recent commit deploys. PRs are grouped by number: once a PR closes
# `github.ref` resolves to the base branch, and grouping by ref would have the
# cleanup run cancel the production deploy it was queued behind.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  # The Cloudflare credentials are attached per step (only the steps that run
  # `cf` or validate them), never to the whole workflow, so `pnpm install` and
  # third-party actions never see them. The migration steps deliberately do not
  # receive them: they only need the database URL. See the steps below.
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # Fork PRs cannot read the deployment secrets, and Dependabot's grouped
    # upgrade PRs do not need a preview environment; CI still checks both.
    #
    # Previews are opt-in through PREVIEW_HYPERDRIVE_ID (the step that resolves
    # the configuration skips every preview step when it is absent). Without
    # this gate a PR ran the job only to install dependencies and skip, then
    # the close event started a second runner to delete previews that were
    # never created: measured runs for one SHA started 32s and 23s apart and
    # did no deployment work. The variable is the same one the resolution step
    # reads, so the job runs exactly when a preview could exist.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'push' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.actor != 'dependabot[bot]' &&
         vars.PREVIEW_HYPERDRIVE_ID != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the Preview comment needs write access to the pull request; the
    # `cleanup` job below keeps the workflow default of `contents: read`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Rspress `lastUpdated` reads per-file Git history; the blob-less
          # commit graph is all it needs.
          fetch-depth: 0
          filter: blob:none
          # Nothing here pushes back to the repository, and the Preview comment
          # receives its token explicitly, so keep the token out of `.git/config`
          # where build scripts could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Fail with the missing names instead of a driver error deep inside
      # Drizzle. The full setup is documented in docs/operations/deployment.md.
      # Production uses a single DATABASE_URL. Preview deployments are opt-in:
      # without a preview database URL and Hyperdrive config they are skipped
      # rather than silently migrating or binding production.
      - name: Resolve deployment configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_HYPERDRIVE_ID: ${{ vars.PREVIEW_HYPERDRIVE_ID }}
          PREVIEW_STORAGE_BUCKET: ${{ vars.PREVIEW_STORAGE_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Read through the environment rather than interpolating the event
          # payload into the script.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ "$EVENT_NAME" = "pull_request" ]; then
            preview="true"
            for name in PREVIEW_DATABASE_URL PREVIEW_HYPERDRIVE_ID PREVIEW_STORAGE_BUCKET; do
              if [ -z "${!name}" ]; then
                preview="false"
                echo "::notice::Skipping the Preview deployment: $name is not configured."
              fi
            done
            echo "preview=$preview" >> "$GITHUB_OUTPUT"
          else
            [ -n "$DATABASE_URL" ] || missing+=("DATABASE_URL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deployment configuration: ${missing[*]}. See docs/operations/deployment.md."
            exit 1
          fi

      - name: Apply production migrations
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm cloud db:migrate

      - name: Apply preview migrations
        if: github.event_name == 'pull_request' && steps.config.outputs.preview == 'true'
        env:
          # Every PR shares the preview database; migrations are additive and
          # run before either Preview is uploaded.
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: pnpm cloud db:migrate

      - name: Deploy API Worker
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ vars.PRODUCTION_ORIGIN || 'https://e.mattrax.app' }}
          MATTRAX_PRODUCTION: "true"
        run: pnpm cloud deploy:prod

      - name: Deploy dashboard Worker
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional GitHub copy of the dashboard's SSR signing secret. When it
          # is absent, fall back to the secret already stored on the Worker.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -n "$AUTH_SECRET" ]; then
            pnpm web deploy:prod
          else
            env -u AUTH_SECRET pnpm web deploy:prod
          fi

      # The first dashboard Preview exists only to learn its generated URL,
      # which becomes the API Preview's canonical origin (cookies, passkey RP
      # id, email links).
      - name: Create the dashboard Preview (bootstrap URL)
        id: web-bootstrap
        if: github.event_name == 'pull_request' && steps.config.outputs.preview == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          output="$(pnpm exec cf previews deploy "$PREVIEW_NAME" 2>&1)" || true
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | awk '/^\{/{start=NR} {lines[NR]=$0} END{if (start > 0) for (i=start; i<=NR; i++) print lines[i]}')"
          url="$(printf '%s' "$json" | jq -r '[(.preview_urls // [])[], (.deployment_urls // [])[]][0] // empty')"
          if [ -z "$url" ]; then
            echo "::error::The dashboard Preview deployed without a URL. Enable Worker Preview URLs for the mattrax Worker."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Create the API Preview
        id: api-preview
        if: github.event_name == 'pull_request' && steps.config.outputs.preview == 'true'
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ steps.web-bootstrap.outputs.url }}
          MATTRAX_HYPERDRIVE_ID: ${{ vars.PREVIEW_HYPERDRIVE_ID }}
          MATTRAX_STORAGE_BUCKET: ${{ vars.PREVIEW_STORAGE_BUCKET }}
          DEV_MAILBOX: "true"
          DEV_MAILBOX_ALLOW_REMOTE: "true"
        run: |
          set -o pipefail
          output="$(pnpm exec cf previews deploy "$PREVIEW_NAME" 2>&1)" || true
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | awk '/^\{/{start=NR} {lines[NR]=$0} END{if (start > 0) for (i=start; i<=NR; i++) print lines[i]}')"
          url="$(printf '%s' "$json" | jq -r '[(.preview_urls // [])[], (.deployment_urls // [])[]][0] // empty')"
          if [ -z "$url" ]; then
            echo "::error::The API Preview deployed without a URL. Enable Worker Preview URLs for the mattrax-api Worker."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Create the dashboard Preview
        id: web-preview
        if: github.event_name == 'pull_request' && steps.config.outputs.preview == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ steps.api-preview.outputs.url }}
        run: |
          set -o pipefail
          output="$(pnpm exec cf previews deploy "$PREVIEW_NAME" 2>&1)" || true
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | awk '/^\{/{start=NR} {lines[NR]=$0} END{if (start > 0) for (i=start; i<=NR; i++) print lines[i]}')"
          url="$(printf '%s' "$json" | jq -r '[(.preview_urls // [])[], (.deployment_urls // [])[]][0] // empty')"
          if [ -z "$url" ]; then
            echo "::error::The dashboard Preview deployed without a URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the Preview
        if: github.event_name == 'pull_request' && steps.config.outputs.preview == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          # The checkout does not persist credentials, so give the comment
          # action the workflow token explicitly. It only needs the
          # `pull-requests: write` scope granted to this job.
          GITHUB_TOKEN: ${{ github.token }}
          header: preview
          message: |
            **Preview:** ${{ steps.web-preview.outputs.url }}
            **API Preview:** ${{ steps.api-preview.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }} against the shared preview database.

  cleanup:
    # Previews only exist for same-repository pull requests (the deploy job
    # skips forks and Dependabot) and only when PREVIEW_HYPERDRIVE_ID is
    # configured. Closing any other PR would otherwise start a runner just to
    # install dependencies and delete nothing.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_HYPERDRIVE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # `cf` deletes a Preview by Worker name. Best-effort: the Preview may
      # already be gone, or the token may have expired since the PR opened.
      - name: Delete the Preview Workers
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec cf previews delete "$PREVIEW_NAME" --worker mattrax --force || true
          pnpm exec cf previews delete "$PREVIEW_NAME" --worker mattrax-api --force || true
