            rel="stylesheet"

    <body class="h-full">
        <h1>Hello World</h1>

        <div class="h-full flex-1 flex justify-center items-center">
            <div
                class="animate-in slide-in-from-top-4 fade-in duration-500 min-h-[18rem] sm:w-full sm:max-w-xs"
            >
                <div class="flex items-center justify-center pb-2">
                    <h2
                        class="mt-4 text-center text-4xl font-bold leading-9 tracking-tight text-gray-900"
                    >
                        Mattrax
                    </h2>
                </div>
                <div class="flex flex-col items-center">
                    <div
                        class="text-sm text-zinc-500 dark:text-zinc-400 text-center"
                    >
                        Log in to use Mattrax
                    </div>
                    <form class="pt-4 w-full max-w-80">
                        <fieldset class="space-y-2">
                            <div class="flex flex-col space-y-1.5">
                                <input
                                    type="email"
                                    class="border-input ring-offset-background placeholder:text-muted-foreground flex h-10 w-full rounded-md border bg-transparent px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-ring focus-visible:ring-2 focus-visible:ring-offset-2 transition-shadow duration-75 disabled:cursor-not-allowed disabled:opacity-50 file:border-0 file:bg-transparent file:text-sm file:font-medium"
                                    placeholder="Email"
                                    autocomplete="email"
                                    id="cl-0"
                                />
                            </div>
                            <button
                                type="submit"
                                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-zinc-950 disabled:pointer-events-none disabled:opacity-50 dark:focus-visible:ring-zinc-300 bg-zinc-900 text-zinc-50 shadow hover:bg-zinc-900/90 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-50/90 h-9 px-4 py-2 w-full"
                            >
                                <span class="text-sm font-semibold leading-6"
                                    >Continue with email</span
                                >
                            </button>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>

        <!-- <a class="uk-button uk-button-default" href="">Bruh</a>
