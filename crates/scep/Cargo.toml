[package]
name = "scep"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
mx-crypto = { path = "../mx-crypto" }

mx-golang = { path = "../mx-golang" }
bcder = "0.7.4" # used by `x509-certificate`
bytes = "1.9.0"
cms = "0.2.3"
cryptographic-message-syntax = { workspace = true, default-features = false }
foreign-types-shared = "0.1.1" # Must match `openssl`
openssl = { version = "0.10.68", features = ["vendored"] } # TODO: Disable vendored cause this is a library
openssl-sys = "0.9.104"
# rsa = { version = "0.9.7", features = ["sha1"] }
x509-certificate = "0.24.0" # used by `cryptographic-message-syntax`
# rcgen = { version = "0.13.2", features = ["x509-parser"] }
# x509-verify.workspace = true
# rustls-pki-types = "1.10.1"
# chrono.workspace = true
# time = "0.3.37"
x509-parser = { version = "0.16.0", features = ["validate", "verify"] } # TODO: Do we need the features?
yasna = "0.5.2"
