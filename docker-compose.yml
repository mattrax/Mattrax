# Local development dependencies. The Workers themselves run through
# `pnpm web dev`; only MySQL (and optionally an object-storage emulator) needs
# to run in Docker.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mattraxe
      MYSQL_USER: mattrax
      MYSQL_PASSWORD: mattrax
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mattraxe-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umattrax", "-pmattrax"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mattraxe-mysql:
